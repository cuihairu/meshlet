name: tray-macos

# Follow-up to R-TRAY-1 (user directive 2026-11-01: macOS x86_64 = tray app macOS packaging):
# build the tray .app on Intel macOS (unsigned, ad-hoc) and run the tray unit tests.
# Honest boundaries: set_autostart/open_log_dir are #[cfg(windows)] and are honestly reported
# as unsupported on macOS; SystemBackend resolves to UnsupportedBackend on macOS; there is no
# signing certificate and no hands-on pass on a real Mac -- this workflow only proves "the .app builds" and that the unit tests are green.

on:
  push:
    branches: [main]
    paths:
      - 'apps/tray-app/**'
      - 'crates/meshlet-commands/**'
      - 'crates/meshlet-network/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/tray-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: build / macos-15-intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1

      # Runner arch guard: macos-latest has moved to arm64, but this job explicitly wants x86_64
      # (Intel); if GitHub changes the runner arch, fail loudly rather than silently ship arm64 as a fake x86_64 asset.
      - name: Assert x86_64 runner
        run: |
          arch=$(uname -m)
          echo "runner arch: $arch"
          test "$arch" = "x86_64" || { echo "expected x86_64 runner, got $arch" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/tray-app/src-tauri

      # tauri-cli and the tauri crate are not released in lockstep: tauri 2.12.5 has no matching cli,
      # and the newest 2.x cli is 2.12.4 (same major, compatible with 2.x config).
      - name: Install tauri-cli 2.12.4
        run: cargo install tauri-cli --locked --version 2.12.4

      # Also run meshlet-network: on macOS the backend resolves to UnsupportedBackend (unsupported.rs
      # only compiles on non-linux/windows), so its rejection-semantics tests actually execute only on macOS.
      - name: Test network + tray
        working-directory: apps/tray-app/src-tauri
        run: cargo test -p meshlet-network -p meshlet-tray

      - name: Build .app (unsigned, ad-hoc)
        working-directory: apps/tray-app/src-tauri
        run: |
          cargo tauri build \
            --config '{"bundle":{"active":true,"targets":["app"],"macOS":{"signingIdentity":"-"}}}'

      # Note: tray is a workspace member, so cargo's target dir is the workspace root
      # `target/` (not `apps/tray-app/src-tauri/target`), and the bundle lands under the root target.
      - name: Upload .app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: meshlet-tray-macos-x86_64-app
          path: target/release/bundle/macos/Meshlet.app
          if-no-files-found: error
