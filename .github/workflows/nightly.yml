name: Nightly build
on:
  schedule:
    # 03:17 Asia/Shanghai; use an off-hour minute to reduce scheduler contention.
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  checks:
    # Nightly must not queue for hours behind the single self-hosted runner
    # (vars.CI_RUNNER); run the pure-build jobs on hosted runners and leave
    # only the kernel dataplane leg on the private box (see dataplane.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      # The workspace includes the Tauri tray-app crate; on Linux, clippy/test
      # for it need GTK+WebKit system libs (glib-sys finds glib-2.0 via
      # pkg-config, missing it fails the build script). Mirror ci.yml.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Validate installer
        run: |
          sudo apt-get update && sudo apt-get install -y msitools wixl wixl-data
          bash -n scripts/install.sh scripts/package-release.sh scripts/package-deb-rpm.sh scripts/validate-wix.sh
          scripts/install.sh --help
          shellcheck scripts/install.sh scripts/package-release.sh scripts/package-deb-rpm.sh
          # Offline wxs gate for the Windows MSI (see apps/cli/wix/main.wxs).
          scripts/validate-wix.sh
          if command -v pwsh >/dev/null; then
            # shellcheck disable=SC2016  # $f/$_ are PowerShell variables, not shell
            pwsh -NoProfile -Command '
              foreach ($f in "scripts/install.ps1", "scripts/package-windows-zip.ps1") {
                $errors = $null
                [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $f), [ref]$null, [ref]$errors)
                if ($errors) {
                  $errors | ForEach-Object { Write-Error "$f : $($_.Message)" }
                  exit 1
                }
              }
              Write-Output "PowerShell scripts parse OK"
            '
          else
            echo "pwsh not available on this runner; skipping PowerShell parse check"
          fi
  dataplane:
    uses: ./.github/workflows/dataplane.yml
    with:
      # Hosted runners carry the wireguard kernel module; routing the nightly
      # dataplane leg there keeps the release independent of the private box
      # being awake (runs queued 8h+ waiting for it).
      runner: ubuntu-24.04
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm --dir console install --frozen-lockfile
      - run: pnpm --dir console run build
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-console
          path: console/dist/
  windows:
    needs: [checks, dataplane]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      # Keep the channel in sync with rust-toolchain.toml (see the build job).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc
          profile: minimal
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: nightly-windows-msvc
      - name: Build Windows agent, cli and tray host
        timeout-minutes: 40
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin meshlet-agent --bin meshlet-cli --bin meshlet-tray-host
      - name: Package Windows zip
        shell: pwsh
        run: scripts/package-windows-zip.ps1 -Target x86_64-pc-windows-msvc
      # MSI leg. Per the cargo-wix playbook: no --target triple here (candle/light
      # resolve relative paths against the repo root, LGHT0103 otherwise), all
      # four bins pre-built in one release-profile invocation so they land in
      # the `target/release` dir that CargoTargetBinDir points at.
      - name: Build release binaries for the MSI
        timeout-minutes: 40
        run: cargo build --locked --release --bin meshlet-server --bin meshlet-agent --bin meshlet-cli --bin meshlet-tray-host
      - name: Install cargo-wix
        timeout-minutes: 15
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build MSI installer
        timeout-minutes: 30
        # Invoked from the repo root: candle/light resolve the wxs' relative
        # content sources (assets/icons/meshlet.ico) against the inherited cwd,
        # and cargo-wix locates the manifest-relative wix/main.wxs itself.
        # -p is required: in a workspace cargo-wix refuses the bare manifest
        # path ("Workspace detected. Please pass a package name.").
        # --nocapture surfaces candle/light stderr in the log instead of only
        # the exit code, which is opaque when the MSI leg fails.
        run: cargo wix -p meshlet-cli --nocapture
      - name: Stage MSI nightly asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # cargo-wix writes the msi to the workspace-root target/wix, not a
          # package-local target dir.
          $msis = Get-ChildItem "$PWD\target\wix\*.msi"
          if ($msis.Count -lt 1) { throw 'no msi produced under target\wix' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $msis[0].FullName dist\meshlet-nightly-windows-x86_64.msi -Force
          Get-Item dist\meshlet-nightly-windows-x86_64.msi | Select-Object Name, Length
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-windows
          path: |
            dist/meshlet-nightly-windows-x86_64.zip
            dist/meshlet-nightly-windows-x86_64.msi
  build:
    needs: [checks, dataplane, console]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      # cargo runs the pinned channel from rust-toolchain.toml, so the musl std
      # must be installed for that channel. Pinning stable here leaves the pinned
      # toolchain without the target and fails with E0463 `core` not found.
      # Keep the channel in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
          profile: minimal
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: nightly-${{ matrix.target }}
      - name: Install static build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nightly-console
          path: console/dist/
      - name: Build static Linux binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target '${{ matrix.target }}' --bin meshlet-server --bin meshlet-agent --bin meshlet-cli
      - name: Package binaries, console and systemd units
        run: scripts/package-release.sh '${{ matrix.target }}' '${{ matrix.arch }}'
      # Component-split .deb/.rpm (meshlet-server / meshlet-agent / meshlet-cli)
      # built with dpkg-deb and rpmbuild; the rpm package provides rpmbuild.
      - name: Build deb and rpm packages
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          scripts/package-deb-rpm.sh '${{ matrix.target }}' '${{ matrix.deb_arch }}' '${{ matrix.rpm_arch }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-binary-${{ matrix.arch }}
          path: dist/*
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          # A single glob: download-artifact does not split a multi-line
          # pattern, so match every nightly artifact prefix with one pattern.
          pattern: nightly-*
          merge-multiple: true
          path: dist/
      - name: Publish rolling nightly release (single release)
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cd dist
          sha256sum meshlet-linux-*.tar.gz meshlet-*.deb meshlet-*.rpm meshlet-nightly-windows-x86_64.zip meshlet-nightly-windows-x86_64.msi install.sh install.ps1 > SHA256SUMS
                    cat > notes.md <<NOTES
          Automated prerelease from commit ${GITHUB_SHA}.
          Linux x86_64 and ARM64 static binaries, web console, systemd units, and per-component deb/rpm packages
          (meshlet-server / meshlet-agent / meshlet-cli) are included, plus a Windows agent+CLI zip, a Windows MSI
          installer (meshlet-nightly-windows-x86_64.msi) and install.ps1 / install.sh one-command installers.
          SHA256SUMS verifies the downloaded assets. BUILD_INFO inside each archive records the source commit.
          This build passed the workspace checks and required Linux kernel dataplane tests.
          The nightly tag tracks the most recent successful build.
          NOTES
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release upload nightly meshlet-linux-*.tar.gz meshlet-*.deb meshlet-*.rpm meshlet-nightly-windows-x86_64.zip meshlet-nightly-windows-x86_64.msi install.sh install.ps1 SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease --title 'Nightly' --notes-file notes.md
          else
            gh release create nightly meshlet-linux-*.tar.gz meshlet-*.deb meshlet-*.rpm meshlet-nightly-windows-x86_64.zip meshlet-nightly-windows-x86_64.msi install.sh install.ps1 SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Nightly' --notes-file notes.md
          fi
