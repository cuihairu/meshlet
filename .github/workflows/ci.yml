name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are the v1-supported agent platforms (archive §15).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      # 76ddfbc 把 apps/tray-app/src-tauri（Tauri v2，依赖 glib/webkit）加进
      # workspace 后，ubuntu 腿的 clippy/test 需要 GTK+WebKit 系统库才能编译
      # （glib-sys 经 pkg-config 找 glib-2.0，缺失即 build script 失败）。
      # 仅在 Linux 装：windows-latest 用 WebView2，不需要这些。
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  deps-gate:
    name: planner dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # R-01 architecture constraint 2/3: the planner must stay dependency-free
      # (no store, no executor, no crypto) so it can be reasoned about in isolation.
      - name: Enforce zero third-party dependencies in meshlet-planner
        run: scripts/check-planner-deps.sh

  # AGENT-WIN-1/3/4 证据腿（todo.md「CI windows-latest 出截图证据」）：
  # tray-host 在真实 Windows 桌面会话消费 TraySink 四态 fixture（examples/
  # tray_fixture 生成，与生产端同一 PNG 格式）、注册托盘图标（NIM_ADD）、
  # 随状态换 tooltip——截图 + stderr 日志上传为验收工件。
  tray-windows:
    name: tray host / windows-latest
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/tray-host

      - name: Test tray host
        run: cargo test -p meshlet-tray-host

      - name: Generate four-state tray fixtures
        # TraySink 布局：fixture 产出 `<out>/<state>/tray/{status.json,icon-*}`，
        # tray-host 以 `<out>\<state>` 为 state_dir（内部拼 `\tray`）。
        run: cargo run -p meshlet-tray-host --example tray_fixture -- tray-fixture

      - name: Build tray host
        run: cargo build -p meshlet-tray-host

      # 托盘宿主有 agent 联动看门狗：无 meshlet-agent.exe 进程时宽限 ~30s 后
      # 自退。stub 常驻进程让截图窗口内托盘保持在线（进程名匹配即满足）。
      - name: Start keep-alive stub agent process
        run: |
          Copy-Item C:\Windows\System32\cmd.exe "$env:TEMP\meshlet-agent.exe" -Force
          Start-Process "$env:TEMP\meshlet-agent.exe" -ArgumentList '/c','ping -n 3600 127.0.0.1' -WindowStyle Hidden

      - name: Launch tray host
        run: |
          $trayHost = Join-Path (Get-Location) "target\debug\meshlet-tray-host.exe"
          Start-Process $trayHost `
            -ArgumentList "$(Resolve-Path tray-fixture\online)" `
            -RedirectStandardError "$PWD\tray-host.log" -RedirectStandardOutput "$PWD\tray-host.out"

      - name: Capture desktop screenshot
        run: |
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.X, $screen.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("$PWD\tray-windows.png")

      # 本地面板门禁（LOCAL-PANEL-1）：tray-host 自托管的 loopback 只读页必须
      # 200 且三块齐全（当前节点 / 直连节点 / 本地路由）——数据来自 fixture 的
      # 状态文件，证明面板不依赖 server 可达。
      # URL 走 `local-panel.json` 交接文件而非日志：重定向的日志在进程存活期间
      # 读不到（本作业上轮踩坑），而面板必须在托盘进程活着时访问。
      - name: Gate on local panel (loopback 200 + three sections)
        run: |
          $ErrorActionPreference = 'Stop'
          $urlFile = "tray-fixture\online\local-panel.json"
          # 有界重试：等文件出现**且能解析出合法 URL**（写入已原子化，但读方
          # 仍按「可能撞见旧文件/半截 JSON」防御，只解析一次会假红）。
          $panel = $null
          for ($i = 0; $i -lt 20; $i++) {
            if (Test-Path $urlFile) {
              try { $panel = Get-Content $urlFile -Raw | ConvertFrom-Json -ErrorAction Stop } catch { $panel = $null }
              if ($panel -and $panel.url -match '^http://127\.0\.0\.1:\d+/') { break }
            }
            $panel = $null
            Start-Sleep -Seconds 1
          }
          if (-not $panel) { Write-Error "no valid $urlFile (panel did not start)"; exit 1 }
          $url = $panel.url
          Write-Output "local panel: $url (pid $($panel.pid))"
          $alive = [bool](Get-Process meshlet-tray-host -ErrorAction SilentlyContinue)
          Write-Output "tray-host alive: $alive"
          # 请求面板：curl 先行（`--noproxy '*'` 绕过 runner 的代理环境，上一轮
          # curl 静默失败只留下空串）；curl 不通就用裸 TCP 直连同一端口——门禁验的
          # 必须是面板本身，不是本机 curl 的环境；两条路径的失败原因都打进日志。
          # 诊断一律走 Write-Host：Write-Output 会污染成功流，把函数返回值变成数组。
          # curl 的 stderr 走 `--stderr <file>`（Actions 默认 EAP=Stop，`2>&1` 会先抛；
          # PS 的 `2>` 重定向在 5.1 下还会把 stderr 变成 ErrorRecord 字符串）。
          function Read-PanelRaw([string]$u, [string]$method, [string]$outFile, [string]$errFile) {
            $eap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & curl.exe -sS --noproxy '*' -i --max-time 10 -X $method --stderr $errFile -o $outFile $u
              $exit = $LASTEXITCODE
            } finally { $ErrorActionPreference = $eap }
            if ($exit -eq 0) { return @{ ok = $true; via = 'curl' } }
            $curlErr = ''
            if (Test-Path $errFile) { $curlErr = (Get-Content $errFile -Raw) }
            Write-Host "curl failed (exit $exit): $curlErr"
            $c = $null
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $ar = $c.BeginConnect('127.0.0.1', ([uri]$u).Port, $null, $null)
              if (-not $ar.AsyncWaitHandle.WaitOne(3000, $false)) { throw 'connect timeout after 3000ms' }
              $c.EndConnect($ar)
              $s = $c.GetStream()
              $s.ReadTimeout = 5000
              $s.WriteTimeout = 5000
              $target = [uri]$u
              $req = "$method $($target.PathAndQuery) HTTP/1.1`r`nHost: 127.0.0.1`r`nConnection: close`r`n`r`n"
              $b = [Text.Encoding]::ASCII.GetBytes($req)
              $s.Write($b, 0, $b.Length)
              # 总读超时（ReadTimeout 只是单次读的空闲上限， trickle-feeding 的
              # 对端能一直占着这一步）——整体 5s 拿不到完整响应就判失败。
              # 按字节收（MemoryStream），不按字符解码——正文含多字节 UTF-8。
              $ms = New-Object System.IO.MemoryStream
              $buf = New-Object byte[] 4096
              $deadline = [DateTime]::UtcNow.AddSeconds(5)
              while ($true) {
                $remaining = [int]([Math]::Floor(($deadline - [DateTime]::UtcNow).TotalMilliseconds))
                if ($remaining -le 0) { throw 'response timeout after 5000ms' }
                $s.ReadTimeout = [Math]::Min($remaining, 5000)
                $n = $s.Read($buf, 0, $buf.Length)
                if ($n -le 0) { break }
                $ms.Write($buf, 0, $n)
              }
              [IO.File]::WriteAllBytes($outFile, $ms.ToArray())
              Write-Host "raw TCP fallback used for $method"
              return @{ ok = $true; via = 'tcp' }
            } catch {
              Write-Host "panel unreachable ($method): curl exit $exit ($curlErr); raw TCP: $_"
              return @{ ok = $false; via = 'none' }
            } finally {
              if ($c -ne $null) { $c.Close() }
            }
          }
          # 状态行与正文分开断言：状态码必须完整匹配（`2000` 不能算 200），section id
          # 只在正文里找（命中响应头就是假绿）。按原始字节切头/正文——正文含多字节
          # UTF-8，字符级切分会在多字节边界上错位。
          function Split-ResponseBytes([byte[]]$bytes) {
            for ($i = 0; $i -le $bytes.Length - 4; $i++) {
              if ($bytes[$i] -eq 13 -and $bytes[$i + 1] -eq 10 -and $bytes[$i + 2] -eq 13 -and $bytes[$i + 3] -eq 10) {
                $body = New-Object byte[] ($bytes.Length - $i - 4)
                [Array]::Copy($bytes, $i + 4, $body, 0, $body.Length)
                return @{ header = [Text.Encoding]::ASCII.GetString($bytes, 0, $i); body = $body }
              }
            }
            return $null
          }
          # early-EOF 假通过守卫（审核意见）：截断响应曾能同时满足「200 + 三
          # section」——现在必须 (1) Content-Length 与正文**字节数**一致（截断即
          # 失配），(2) 正文以 </html> 结尾。两条全过才算完整响应。
          function Assert-ResponseComplete([hashtable]$parts, [string]$label) {
            $cl = $null
            foreach ($line in ($parts.header -split "`r`n")) {
              if ($line -match '(?i)^Content-Length: *(\d+) *$') { $cl = [long]$matches[1] }
            }
            if ($null -eq $cl) { Write-Error "$label response has no Content-Length header"; return $false }
            if ($cl -ne $parts.body.Length) {
              Write-Error "$label response truncated (early EOF): Content-Length $cl but body is $($parts.body.Length) bytes"
              return $false
            }
            $bodyText = [Text.Encoding]::UTF8.GetString($parts.body)
            if ($bodyText.TrimEnd() -notmatch '</html>$') { Write-Error "$label body does not end with </html> (truncated?)"; return $false }
            return $true
          }
          function Assert-Sections([byte[]]$body, [string]$label) {
            $bodyText = [Text.Encoding]::UTF8.GetString($body)
            foreach ($id in 'id="node"', 'id="direct"', 'id="routes"') {
              if (-not $bodyText.Contains($id)) { Write-Error "$label body missing section $id"; return $false }
            }
            return $true
          }
          $rawFile = Join-Path $PWD 'tray-http.raw'
          $errFile = Join-Path $PWD 'tray-http.err'
          $got = Read-PanelRaw $url 'GET' $rawFile $errFile
          if (-not $got.ok) { exit 1 }
          $bytes = [IO.File]::ReadAllBytes($rawFile)
          $parts = Split-ResponseBytes $bytes
          if ($null -eq $parts) { Write-Error "malformed response (no header/body separator): $([Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(300, $bytes.Length)))"; exit 1 }
          $status = ($parts.header -split "`r`n")[0]
          Write-Output "GET via $($got.via): $status"
          if ($status -notmatch '^HTTP/1\.1 200(?:\s|$)') { Write-Error "local panel not 200: $status"; exit 1 }
          if (-not (Assert-ResponseComplete $parts 'GET')) { exit 1 }
          if (-not (Assert-Sections $parts.body 'GET')) { exit 1 }
          New-Item -ItemType Directory -Force tray-host-out | Out-Null
          # 工件存正文原始字节（不含响应头、不带 BOM）：fallback 路径不能把头当
          # HTML 存下来，`Set-Content -Encoding UTF8` 在 5.1 下还会加 BOM。
          [IO.File]::WriteAllBytes("$PWD\tray-host-out\tray-panel.html", $parts.body)
          # 非 GET 只读语义：写操作必须被拒绝。
          $post = Read-PanelRaw $url 'POST' $rawFile $errFile
          if (-not $post.ok) { exit 1 }
          $postBytes = [IO.File]::ReadAllBytes($rawFile)
          $postParts = Split-ResponseBytes $postBytes
          if ($null -eq $postParts) { Write-Error "malformed POST response"; exit 1 }
          $postStatus = ($postParts.header -split "`r`n")[0]
          Write-Output "POST via $($post.via): $postStatus"
          if ($postStatus -notmatch '^HTTP/1\.1 405(?:\s|$)') { Write-Error "local panel accepted a write method: $postStatus"; exit 1 }
          if (-not (Assert-ResponseComplete $postParts 'POST')) { exit 1 }

      # 桌面会话里真实打开面板页并截屏（best-effort：浏览器启动时序不受控，
      # 失败不红 CI——硬门禁在上一步的 curl 断言）。
      - name: Open local panel in desktop session and capture
        continue-on-error: true
        run: |
          $panel = Get-Content "tray-fixture\online\local-panel.json" -Raw | ConvertFrom-Json
          Start-Process $panel.url
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.X, $screen.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("$PWD\tray-panel.png")

      # 先停进程再验门禁：重定向日志在进程持有期间被锁，读不到内容（上轮踩坑）。
      - name: Stop stub and tray host
        if: always()
        run: |
          Get-Process meshlet-tray-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      # 门禁：托盘图标注册成功（NIM_ADD = true）且 tooltip 随状态 JSON 更新。
      - name: Gate on tray registration evidence
        run: |
          Get-Content tray-host.log | Write-Output
          $log = Get-Content tray-host.log -Raw
          if ($log -notmatch 'NIM_ADD = (true|1)') { Write-Error 'tray icon was not registered (NIM_ADD)'; exit 1 }
          if ($log -notmatch 'tooltip=') { Write-Error 'tooltip was not applied from status.json'; exit 1 }

      - name: Upload tray evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tray-windows-evidence
          path: |
            tray-windows.png
            tray-panel.png
            tray-host-out/tray-panel.html
            tray-host.log
            tray-fixture/**/status.json
            tray-fixture/**/local-panel.json
            tray-fixture/**/*.png
          if-no-files-found: warn

  installer-windows:
    name: installer / windows-latest
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build installer payload
        timeout-minutes: 20
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin meshlet-agent --bin meshlet-cli --bin meshlet-tray-host

      - name: Package staged archive
        shell: pwsh
        run: |
          scripts/package-windows-zip.ps1 -Target x86_64-pc-windows-msvc
          $hash = (Get-FileHash dist\meshlet-nightly-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *meshlet-nightly-windows-x86_64.zip" | Set-Content dist\SHA256SUMS -Encoding ascii

      - name: Run staged installer
        shell: pwsh
        run: |
          $env:MESHLET_INSTALL_ARCHIVE = "$PWD\dist\meshlet-nightly-windows-x86_64.zip"
          $env:MESHLET_INSTALL_SHA256SUMS = "$PWD\dist\SHA256SUMS"
          scripts\install.ps1 `
            -ServerUrl 'http://127.0.0.1:9' `
            -HubEndpoint '127.0.0.1:9' `
            -BootstrapToken 'ci-bootstrap-token' `
            -DeviceName 'ci-windows-installer'

      - name: Verify tray installation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'meshlet'
          $stateDir = Join-Path $installDir 'state'
          foreach ($name in 'meshlet-agent.exe', 'meshlet-cli.exe', 'meshlet-tray-host.exe') {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path)) { throw "installer did not copy $name" }
          }

          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $agentExe = Join-Path $installDir 'meshlet-agent.exe'
          $configPath = Join-Path $installDir 'agent.toml'
          $expectedAgent = 'powershell -NoProfile -WindowStyle Hidden -Command "& ''{0}'' ''{1}''"' -f $agentExe, $configPath
          $expectedTray = '"{0}" "{1}"' -f (Join-Path $installDir 'meshlet-tray-host.exe'), $stateDir
          $agentRun = Get-ItemPropertyValue -Path $runKey -Name 'meshlet-agent'
          if ($agentRun -ne $expectedAgent) { throw "unexpected agent Run value: $agentRun" }
          $trayRun = Get-ItemPropertyValue -Path $runKey -Name 'meshlet-tray-host'
          if ($trayRun -ne $expectedTray) { throw "unexpected tray Run value: $trayRun" }

          $deadline = (Get-Date).AddSeconds(30)
          do {
            $tray = Get-Process -Name 'meshlet-tray-host' -ErrorAction SilentlyContinue
            if ($tray) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $tray) { throw 'meshlet-tray-host process was not started' }
          Write-Output "meshlet-tray-host is running (PID $($tray[0].Id))"

      - name: Verify NoStartTray skips immediate launch
        shell: pwsh
        run: |
          Get-Process meshlet-tray-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $env:MESHLET_INSTALL_ARCHIVE = "$PWD\dist\meshlet-nightly-windows-x86_64.zip"
          $env:MESHLET_INSTALL_SHA256SUMS = "$PWD\dist\SHA256SUMS"
          scripts\install.ps1 -NoStartTray
          Start-Sleep -Seconds 3
          if (Get-Process -Name 'meshlet-tray-host' -ErrorAction SilentlyContinue) {
            throw 'meshlet-tray-host was started despite -NoStartTray'
          }

      - name: Cleanup installed processes
        if: always()
        shell: pwsh
        run: |
          Get-Process meshlet-tray-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force

  console:
    name: console build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Type check and build
        working-directory: console
        run: pnpm run build

  walkthrough:
    name: walkthrough / ubuntu-latest
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build release package
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir console build
          cargo build --locked --release --target x86_64-unknown-linux-gnu --bin meshlet-server --bin meshlet-agent --bin meshlet-cli
          scripts/package-release.sh x86_64-unknown-linux-gnu x86_64
          (cd dist && sha256sum meshlet-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Install from staged release archive
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d)
          tar -xzf dist/meshlet-linux-x86_64.tar.gz -C "$install_dir"
          sudo env \
            MESHLET_INSTALL_ARCHIVE="$PWD/dist/meshlet-linux-x86_64.tar.gz" \
            MESHLET_INSTALL_SHA256SUMS="$PWD/dist/SHA256SUMS" \
            bash "$install_dir/install.sh" server --bind 127.0.0.1:8080
      - name: Verify clean-host walkthrough gates
        run: |
          set -euo pipefail
          sudo systemctl cat meshlet-server | tee /tmp/meshlet-unit.txt
          sudo systemctl is-active --quiet meshlet-server
          id meshlet | tee /tmp/meshlet-account.txt
          test "$(stat -c '%U:%G %a' /etc/meshlet/hub.key)" = 'meshlet:meshlet 600'
          test "$(stat -c '%U:%G %a' /etc/meshlet/meshlet.toml)" = 'meshlet:meshlet 600'
          test "$(stat -c '%a' /var/lib/meshlet)" = 700
          sudo grep -Fx 'bind = "127.0.0.1:8080"' /etc/meshlet/meshlet.toml | tee /tmp/meshlet-bind.txt
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/api/v1/system/status; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/system/status >/dev/null
          sudo ss -ltnp | grep -F '127.0.0.1:8080' | grep -F 'users:(("meshlet-server"' | tee /tmp/meshlet-listener.txt
          test ! -r /etc/meshlet/hub.key
          first=/tmp/meshlet-first-bootstrap.json
          second=/tmp/meshlet-second-bootstrap.json
          first_status=$(curl --silent --show-error --output "$first" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"admin@test.local","password":"walkthrough-password-123"}' \
            http://127.0.0.1:8080/api/v1/auth/bootstrap)
          test "$first_status" = 201
          second_status=$(curl --silent --show-error --output "$second" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"second@test.local","password":"walkthrough-password-123"}' \
            http://127.0.0.1:8080/api/v1/auth/bootstrap)
          test "$second_status" = 409
          sudo systemctl show meshlet-server \
            -p User -p Group -p NoNewPrivileges -p CapabilityBoundingSet \
            -p ProtectSystem -p PrivateDevices -p RestrictAddressFamilies \
            | tee /tmp/meshlet-security.txt
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: walkthrough-evidence
          path: |
            /tmp/meshlet-account.txt
            /tmp/meshlet-bind.txt
            /tmp/meshlet-first-bootstrap.json
            /tmp/meshlet-listener.txt
            /tmp/meshlet-second-bootstrap.json
            /tmp/meshlet-security.txt
            /tmp/meshlet-unit.txt
          if-no-files-found: ignore
