name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are the v1-supported agent platforms (archive §15).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      # 76ddfbc added apps/tray-app/src-tauri (Tauri v2, depends on glib/webkit) to
      # the workspace, so the ubuntu leg's clippy/test needs the GTK+WebKit system
      # libraries to compile (glib-sys resolves glib-2.0 via pkg-config; missing, the build script fails).
      # Linux only: windows-latest uses WebView2 and needs none of these.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  deps-gate:
    name: planner dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # R-01 architecture constraint 2/3: the planner must stay dependency-free
      # (no store, no executor, no crypto) so it can be reasoned about in isolation.
      - name: Enforce zero third-party dependencies in meshlet-planner
        run: scripts/check-planner-deps.sh

  # AGENT-WIN-1/3/4 evidence leg (todo.md: "CI windows-latest produces screenshot
  # evidence"): in a real Windows desktop session tray-host consumes the TraySink
  # four-state fixture (examples/tray_fixture output, same PNG format as production),
  # registers the tray icon (NIM_ADD) and swaps the tooltip per state; screenshots + stderr log are uploaded as acceptance artifacts.
  tray-windows:
    name: tray host / windows-latest
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/tray-host

      - name: Test tray host
        run: cargo test -p meshlet-tray-host

      - name: Generate four-state tray fixtures
        # TraySink layout: the fixture produces `<out>/<state>/tray/{status.json,icon-*}`,
        # tray-host uses `<out>\<state>` as state_dir (it joins `\tray` internally).
        run: cargo run -p meshlet-tray-host --example tray_fixture -- tray-fixture

      - name: Build tray host
        run: cargo build -p meshlet-tray-host

      # The tray host has an agent watchdog: with no meshlet-agent.exe process it
      # self-exits after a ~30s grace period. A resident stub keeps the tray online through the capture window (a process-name match is enough).
      - name: Start keep-alive stub agent process
        run: |
          Copy-Item C:\Windows\System32\cmd.exe "$env:TEMP\meshlet-agent.exe" -Force
          Start-Process "$env:TEMP\meshlet-agent.exe" -ArgumentList '/c','ping -n 3600 127.0.0.1' -WindowStyle Hidden

      - name: Launch tray host
        run: |
          $trayHost = Join-Path (Get-Location) "target\debug\meshlet-tray-host.exe"
          # `-WindowStyle Hidden`: gives the process its own (hidden) console instead of
          # hanging off this step's runner console -- measured (run 42267986109): without it, tray-host gets
          # silently reaped between the launch step and later steps (no panic in the log, process gone).
          Start-Process $trayHost `
            -ArgumentList "$(Resolve-Path tray-fixture\online)" `
            -WindowStyle Hidden `
            -RedirectStandardError "$PWD\tray-host.log" -RedirectStandardOutput "$PWD\tray-host.out"

      - name: Capture desktop screenshot
        run: |
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.X, $screen.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("$PWD\tray-windows.png")

      # Local panel gate (LOCAL-PANEL-1): the loopback read-only page tray-host
      # self-hosts must return 200 with all three sections present (current node /
      # direct nodes / local routes) -- data comes from the fixture's status files,
      # proving the panel does not depend on the server being reachable. The URL
      # goes via the `local-panel.json` handoff file, not the log: redirected logs are unreadable while the process lives (pitfall from this job's last round), and the panel must be reached while the tray process is up.
      - name: Gate on local panel (loopback 200 + three sections)
        run: |
          $ErrorActionPreference = 'Stop'
          $urlFile = "tray-fixture\online\local-panel.json"
          # Bounded retry: wait for the file to exist **and parse into a valid URL**
          # (writes are atomic, but the reader still guards against a stale file / truncated JSON; parsing once risks a false red).
          $panel = $null
          for ($i = 0; $i -lt 20; $i++) {
            if (Test-Path $urlFile) {
              try { $panel = Get-Content $urlFile -Raw | ConvertFrom-Json -ErrorAction Stop } catch { $panel = $null }
              if ($panel -and $panel.url -match '^http://127\.0\.0\.1:\d+/') { break }
            }
            $panel = $null
            Start-Sleep -Seconds 1
          }
          if (-not $panel) { Write-Error "no valid $urlFile (panel did not start)"; exit 1 }
          $url = $panel.url
          Write-Output "local panel: $url (pid $($panel.pid))"
          $alive = [bool](Get-Process meshlet-tray-host -ErrorAction SilentlyContinue)
          Write-Output "tray-host alive: $alive"
          # Measured (run 42267986109): tray-host gets silently reaped by the CI session between the
          # launch step and the gate step (no panic in the stderr log, process gone, connections
          # refused); last round the old gate's "curl empty output" was a refused connection swallowed
          # by `-s`. The gate self-heals: if it died, relaunch in place and re-verify -- startup and
          # probing share one step, so the process no longer needs to survive across steps. After a
          # relaunch the new process atomically overwrites `local-panel.json` (new port/pid): wait for the pid to change to get the new URL; no new pid = failure, no false green off a stale URL.
          if (-not $alive) {
            $exe = Join-Path (Get-Location) 'target\debug\meshlet-tray-host.exe'
            if (-not (Test-Path $exe)) { Write-Error 'meshlet-tray-host.exe missing (build step did not run?)'; exit 1 }
            Write-Host "tray-host died between steps; relaunching $exe"
            # Delete the stale handoff file before relaunching: the kernel may reuse pids, so the old
            # file's pid can collide with the new process's PID -- once deleted, only a file written
            # after the relaunch can pass the equality check. Removal must succeed and be verified
            # (`-ErrorAction Stop` + recheck): undeletable (permissions/in use) = red, no stale file in the wait loop.
            if (Test-Path $urlFile) { Remove-Item $urlFile -ErrorAction Stop }
            if (Test-Path $urlFile) { Write-Error "failed to remove stale $urlFile"; exit 1 }
            # `-PassThru`: obtain the new process's real PID; the handoff file's pid
            # must equal it to count as "new process observed".
            $proc = Start-Process $exe `
              -ArgumentList "$(Resolve-Path tray-fixture\online)" `
              -WindowStyle Hidden `
              -RedirectStandardError "$PWD\tray-host-relaunch.log" -RedirectStandardOutput "$PWD\tray-host-relaunch.out" `
              -PassThru
            $panel = $null
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $urlFile) {
                try { $p2 = Get-Content $urlFile -Raw | ConvertFrom-Json -ErrorAction Stop } catch { $p2 = $null }
                # The handoff pid must be an integer > 0 equal to the just-started process's
                # PID -- missing pid, malformed pid, or stale-file leftover does not count as "new process observed"; keep waiting.
                $newPid = $p2.pid
                if ($p2 -and $p2.url -match '^http://127\.0\.0\.1:\d+/' -and
                    ($newPid -is [int] -or $newPid -is [long]) -and $newPid -gt 0 -and $newPid -eq $proc.Id) { $panel = $p2; break }
              }
            }
            if (-not $panel) { Write-Error 'tray-host relaunch did not publish a new local-panel.json'; exit 1 }
            $url = $panel.url
            Write-Output "relaunched tray-host: $url (pid $($panel.pid))"
          }
          # Ask the panel: curl first (`--noproxy '*'` bypasses the runner's proxy env; last round
          # curl failed silently and left an empty string); if curl cannot get through, hit
          # the same port over raw TCP -- the gate must exercise the panel itself, not this machine's
          # curl environment; both paths log their failure reason. Diagnostics always go through
          # Write-Host: Write-Output pollutes the success stream and turns the function's return
          # value into an array. curl's stderr goes to `--stderr <file>` (Actions defaults to EAP=Stop, so `2>&1` throws first; PS `2>` redirection on 5.1 also turns stderr into an ErrorRecord string).
          function Read-PanelRaw([string]$u, [string]$method, [string]$outFile, [string]$errFile) {
            $eap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & curl.exe -sS --noproxy '*' -i --max-time 10 -X $method --stderr $errFile -o $outFile $u
              $exit = $LASTEXITCODE
            } finally { $ErrorActionPreference = $eap }
            if ($exit -eq 0) { return @{ ok = $true; via = 'curl' } }
            $curlErr = ''
            if (Test-Path $errFile) { $curlErr = (Get-Content $errFile -Raw) }
            Write-Host "curl failed (exit $exit): $curlErr"
            $c = $null
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $ar = $c.BeginConnect('127.0.0.1', ([uri]$u).Port, $null, $null)
              if (-not $ar.AsyncWaitHandle.WaitOne(3000, $false)) { throw 'connect timeout after 3000ms' }
              $c.EndConnect($ar)
              $s = $c.GetStream()
              $s.ReadTimeout = 5000
              $s.WriteTimeout = 5000
              $target = [uri]$u
              $req = "$method $($target.PathAndQuery) HTTP/1.1`r`nHost: 127.0.0.1`r`nConnection: close`r`n`r`n"
              $b = [Text.Encoding]::ASCII.GetBytes($req)
              $s.Write($b, 0, $b.Length)
              # Overall read deadline (ReadTimeout is only a per-read idle limit, and a
              # trickle-feeding peer can hold this step forever) -- no complete response within 5s total is a failure.
              # Collect bytes (MemoryStream), don't decode as characters -- the body holds multibyte UTF-8.
              $ms = New-Object System.IO.MemoryStream
              $buf = New-Object byte[] 4096
              $deadline = [DateTime]::UtcNow.AddSeconds(5)
              while ($true) {
                $remaining = [int]([Math]::Floor(($deadline - [DateTime]::UtcNow).TotalMilliseconds))
                if ($remaining -le 0) { throw 'response timeout after 5000ms' }
                $s.ReadTimeout = [Math]::Min($remaining, 5000)
                $n = $s.Read($buf, 0, $buf.Length)
                if ($n -le 0) { break }
                $ms.Write($buf, 0, $n)
              }
              [IO.File]::WriteAllBytes($outFile, $ms.ToArray())
              Write-Host "raw TCP fallback used for $method"
              return @{ ok = $true; via = 'tcp' }
            } catch {
              Write-Host "panel unreachable ($method): curl exit $exit ($curlErr); raw TCP: $_"
              return @{ ok = $false; via = 'none' }
            } finally {
              if ($c -ne $null) { $c.Close() }
            }
          }
          # Assert status line and body separately: the status code must match in full
          # (`2000` must not count as 200), and section ids are looked up in the body only
          # (a header hit would be a false green); split on raw bytes -- multibyte UTF-8 bodies misalign under character-level splits.
          function Split-ResponseBytes([byte[]]$bytes) {
            for ($i = 0; $i -le $bytes.Length - 4; $i++) {
              if ($bytes[$i] -eq 13 -and $bytes[$i + 1] -eq 10 -and $bytes[$i + 2] -eq 13 -and $bytes[$i + 3] -eq 10) {
                $body = New-Object byte[] ($bytes.Length - $i - 4)
                [Array]::Copy($bytes, $i + 4, $body, 0, $body.Length)
                return @{ header = [Text.Encoding]::ASCII.GetString($bytes, 0, $i); body = $body }
              }
            }
            return $null
          }
          # Early-EOF false-pass guard (reviewer's point): a truncated response used to satisfy
          # "200 + three sections" at once -- now required: (1) Content-Length matches the body's
          # **byte count** (truncation = mismatch), (2) the body ends with </html>. Both must pass to count as a complete response.
          function Assert-ResponseComplete([hashtable]$parts, [string]$label) {
            $cl = $null
            foreach ($line in ($parts.header -split "`r`n")) {
              if ($line -match '(?i)^Content-Length: *(\d+) *$') { $cl = [long]$matches[1] }
            }
            if ($null -eq $cl) { Write-Error "$label response has no Content-Length header"; return $false }
            if ($cl -ne $parts.body.Length) {
              Write-Error "$label response truncated (early EOF): Content-Length $cl but body is $($parts.body.Length) bytes"
              return $false
            }
            $bodyText = [Text.Encoding]::UTF8.GetString($parts.body)
            if ($bodyText.TrimEnd() -notmatch '</html>$') { Write-Error "$label body does not end with </html> (truncated?)"; return $false }
            return $true
          }
          function Assert-Sections([byte[]]$body, [string]$label) {
            $bodyText = [Text.Encoding]::UTF8.GetString($body)
            foreach ($id in 'id="node"', 'id="direct"', 'id="routes"') {
              if (-not $bodyText.Contains($id)) { Write-Error "$label body missing section $id"; return $false }
            }
            return $true
          }
          $rawFile = Join-Path $PWD 'tray-http.raw'
          $errFile = Join-Path $PWD 'tray-http.err'
          $got = Read-PanelRaw $url 'GET' $rawFile $errFile
          if (-not $got.ok) { exit 1 }
          $bytes = [IO.File]::ReadAllBytes($rawFile)
          $parts = Split-ResponseBytes $bytes
          if ($null -eq $parts) { Write-Error "malformed response (no header/body separator): $([Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(300, $bytes.Length)))"; exit 1 }
          $status = ($parts.header -split "`r`n")[0]
          Write-Output "GET via $($got.via): $status"
          if ($status -notmatch '^HTTP/1\.1 200(?:\s|$)') { Write-Error "local panel not 200: $status"; exit 1 }
          if (-not (Assert-ResponseComplete $parts 'GET')) { exit 1 }
          if (-not (Assert-Sections $parts.body 'GET')) { exit 1 }
          New-Item -ItemType Directory -Force tray-host-out | Out-Null
          # The artifact stores the body's raw bytes (no response headers, no BOM): the fallback
          # path must not save headers as HTML, and `Set-Content -Encoding UTF8` adds a BOM on 5.1.
          [IO.File]::WriteAllBytes("$PWD\tray-host-out\tray-panel.html", $parts.body)
          # Read-only semantics beyond GET: write methods must be rejected.
          $post = Read-PanelRaw $url 'POST' $rawFile $errFile
          if (-not $post.ok) { exit 1 }
          $postBytes = [IO.File]::ReadAllBytes($rawFile)
          $postParts = Split-ResponseBytes $postBytes
          if ($null -eq $postParts) { Write-Error "malformed POST response"; exit 1 }
          $postStatus = ($postParts.header -split "`r`n")[0]
          Write-Output "POST via $($post.via): $postStatus"
          if ($postStatus -notmatch '^HTTP/1\.1 405(?:\s|$)') { Write-Error "local panel accepted a write method: $postStatus"; exit 1 }
          if (-not (Assert-ResponseComplete $postParts 'POST')) { exit 1 }

      # Really open the panel page in the desktop session and screenshot it (best-effort:
      # browser startup timing is uncontrolled and failure does not redden CI -- the hard gate is the curl assertion above).
      - name: Open local panel in desktop session and capture
        continue-on-error: true
        run: |
          $panel = Get-Content "tray-fixture\online\local-panel.json" -Raw | ConvertFrom-Json
          Start-Process $panel.url
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.X, $screen.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("$PWD\tray-panel.png")

      # Stop the processes before gating on the log: redirected logs are locked while the process holds them (tripped over this last round).
      - name: Stop stub and tray host
        if: always()
        run: |
          Get-Process meshlet-tray -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      # Gate: tray icon registered successfully (NIM_ADD = true) and tooltip follows the status JSON.
      - name: Gate on tray registration evidence
        run: |
          Get-Content tray-host.log | Write-Output
          $log = Get-Content tray-host.log -Raw
          if ($log -notmatch 'NIM_ADD = (true|1)') { Write-Error 'tray icon was not registered (NIM_ADD)'; exit 1 }
          if ($log -notmatch 'tooltip=') { Write-Error 'tooltip was not applied from status.json'; exit 1 }

      - name: Upload tray evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tray-windows-evidence
          path: |
            tray-windows.png
            tray-panel.png
            tray-host-out/tray-panel.html
            tray-host.log
            tray-host-relaunch.log
            tray-fixture/**/status.json
            tray-fixture/**/local-panel.json
            tray-fixture/**/*.png
          if-no-files-found: warn

  installer-windows:
    name: installer / windows-latest
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build installer payload
        timeout-minutes: 20
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin meshlet-agent --bin meshlet-cli --bin meshlet-tray

      - name: Package staged archive
        shell: pwsh
        run: |
          scripts/package-windows-zip.ps1 -Target x86_64-pc-windows-msvc
          $hash = (Get-FileHash dist\meshlet-nightly-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *meshlet-nightly-windows-x86_64.zip" | Set-Content dist\SHA256SUMS -Encoding ascii

      - name: Run staged installer
        shell: pwsh
        run: |
          $env:MESHLET_INSTALL_ARCHIVE = "$PWD\dist\meshlet-nightly-windows-x86_64.zip"
          $env:MESHLET_INSTALL_SHA256SUMS = "$PWD\dist\SHA256SUMS"
          scripts\install.ps1 `
            -ServerUrl 'http://127.0.0.1:9' `
            -HubEndpoint '127.0.0.1:9' `
            -BootstrapToken 'ci-bootstrap-token' `
            -DeviceName 'ci-windows-installer'

      - name: Verify tray installation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'meshlet'
          $stateDir = Join-Path $installDir 'state'
          foreach ($name in 'meshlet-agent.exe', 'meshlet-cli.exe', 'meshlet-tray.exe') {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path)) { throw "installer did not copy $name" }
          }

          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $agentExe = Join-Path $installDir 'meshlet-agent.exe'
          $configPath = Join-Path $installDir 'agent.toml'
          $expectedAgent = 'powershell -NoProfile -WindowStyle Hidden -Command "& ''{0}'' ''{1}''"' -f $agentExe, $configPath
          $expectedTray = '"{0}"' -f (Join-Path $installDir 'meshlet-tray.exe')
          $agentRun = Get-ItemPropertyValue -Path $runKey -Name 'meshlet-agent'
          if ($agentRun -ne $expectedAgent) { throw "unexpected agent Run value: $agentRun" }
          $trayRun = Get-ItemPropertyValue -Path $runKey -Name 'meshlet'
          if ($trayRun -ne $expectedTray) { throw "unexpected tray Run value: $trayRun" }

          $deadline = (Get-Date).AddSeconds(30)
          do {
            $tray = Get-Process -Name 'meshlet-tray' -ErrorAction SilentlyContinue
            if ($tray) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $tray) { throw 'meshlet-tray process was not started' }
          Write-Output "meshlet-tray is running (PID $($tray[0].Id))"

      - name: Verify NoStartTray skips immediate launch
        shell: pwsh
        run: |
          Get-Process meshlet-tray -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $env:MESHLET_INSTALL_ARCHIVE = "$PWD\dist\meshlet-nightly-windows-x86_64.zip"
          $env:MESHLET_INSTALL_SHA256SUMS = "$PWD\dist\SHA256SUMS"
          scripts\install.ps1 -NoStartTray
          Start-Sleep -Seconds 3
          if (Get-Process -Name 'meshlet-tray' -ErrorAction SilentlyContinue) {
            throw 'meshlet-tray was started despite -NoStartTray'
          }

      - name: Cleanup installed processes
        if: always()
        shell: pwsh
        run: |
          Get-Process meshlet-tray -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force

  console:
    name: console build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Type check and build
        working-directory: console
        run: pnpm run build

  walkthrough:
    name: walkthrough / ubuntu-latest
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build release package
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir console build
          cargo build --locked --release --target x86_64-unknown-linux-gnu --bin meshlet-server --bin meshlet-agent --bin meshlet-cli
          scripts/package-release.sh x86_64-unknown-linux-gnu x86_64
          (cd dist && sha256sum meshlet-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Install from staged release archive
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d)
          tar -xzf dist/meshlet-linux-x86_64.tar.gz -C "$install_dir"
          sudo env \
            MESHLET_INSTALL_ARCHIVE="$PWD/dist/meshlet-linux-x86_64.tar.gz" \
            MESHLET_INSTALL_SHA256SUMS="$PWD/dist/SHA256SUMS" \
            bash "$install_dir/install.sh" server --bind 127.0.0.1:8080
      - name: Verify clean-host walkthrough gates
        run: |
          set -euo pipefail
          sudo systemctl cat meshlet-server | tee /tmp/meshlet-unit.txt
          sudo systemctl is-active --quiet meshlet-server
          id meshlet | tee /tmp/meshlet-account.txt
          test "$(stat -c '%U:%G %a' /etc/meshlet/hub.key)" = 'meshlet:meshlet 600'
          test "$(stat -c '%U:%G %a' /etc/meshlet/meshlet.toml)" = 'meshlet:meshlet 600'
          test "$(stat -c '%a' /var/lib/meshlet)" = 700
          sudo grep -Fx 'bind = "127.0.0.1:8080"' /etc/meshlet/meshlet.toml | tee /tmp/meshlet-bind.txt
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/api/v1/system/status; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/system/status >/dev/null
          sudo ss -ltnp | grep -F '127.0.0.1:8080' | grep -F 'users:(("meshlet-server"' | tee /tmp/meshlet-listener.txt
          test ! -r /etc/meshlet/hub.key
          first=/tmp/meshlet-first-bootstrap.json
          second=/tmp/meshlet-second-bootstrap.json
          first_status=$(curl --silent --show-error --output "$first" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"admin@test.local","password":"walkthrough-password-123"}' \
            http://127.0.0.1:8080/api/v1/auth/bootstrap)
          test "$first_status" = 201
          second_status=$(curl --silent --show-error --output "$second" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"second@test.local","password":"walkthrough-password-123"}' \
            http://127.0.0.1:8080/api/v1/auth/bootstrap)
          test "$second_status" = 409
          sudo systemctl show meshlet-server \
            -p User -p Group -p NoNewPrivileges -p CapabilityBoundingSet \
            -p ProtectSystem -p PrivateDevices -p RestrictAddressFamilies \
            | tee /tmp/meshlet-security.txt
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: walkthrough-evidence
          path: |
            /tmp/meshlet-account.txt
            /tmp/meshlet-bind.txt
            /tmp/meshlet-first-bootstrap.json
            /tmp/meshlet-listener.txt
            /tmp/meshlet-second-bootstrap.json
            /tmp/meshlet-security.txt
            /tmp/meshlet-unit.txt
          if-no-files-found: ignore
