name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are the v1-supported agent platforms (archive §15).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      # 76ddfbc 把 apps/tray-app/src-tauri（Tauri v2，依赖 glib/webkit）加进
      # workspace 后，ubuntu 腿的 clippy/test 需要 GTK+WebKit 系统库才能编译
      # （glib-sys 经 pkg-config 找 glib-2.0，缺失即 build script 失败）。
      # 仅在 Linux 装：windows-latest 用 WebView2，不需要这些。
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  deps-gate:
    name: planner dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # R-01 architecture constraint 2/3: the planner must stay dependency-free
      # (no store, no executor, no crypto) so it can be reasoned about in isolation.
      - name: Enforce zero third-party dependencies in meshlet-planner
        run: scripts/check-planner-deps.sh

  # AGENT-WIN-1/3/4 证据腿（todo.md「CI windows-latest 出截图证据」）：
  # tray-host 在真实 Windows 桌面会话消费 TraySink 四态 fixture（examples/
  # tray_fixture 生成，与生产端同一 PNG 格式）、注册托盘图标（NIM_ADD）、
  # 随状态换 tooltip——截图 + stderr 日志上传为验收工件。
  tray-windows:
    name: tray host / windows-latest
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/tray-host

      - name: Test tray host
        run: cargo test -p meshlet-tray-host

      - name: Generate four-state tray fixtures
        # TraySink 布局：fixture 产出 `<out>/<state>/tray/{status.json,icon-*}`，
        # tray-host 以 `<out>\<state>` 为 state_dir（内部拼 `\tray`）。
        run: cargo run -p meshlet-tray-host --example tray_fixture -- tray-fixture

      - name: Build tray host
        run: cargo build -p meshlet-tray-host

      # 托盘宿主有 agent 联动看门狗：无 meshlet-agent.exe 进程时宽限 ~30s 后
      # 自退。stub 常驻进程让截图窗口内托盘保持在线（进程名匹配即满足）。
      - name: Start keep-alive stub agent process
        run: |
          Copy-Item C:\Windows\System32\cmd.exe "$env:TEMP\meshlet-agent.exe" -Force
          Start-Process "$env:TEMP\meshlet-agent.exe" -ArgumentList '/c','ping -n 3600 127.0.0.1' -WindowStyle Hidden

      - name: Launch tray host
        run: |
          $trayHost = Join-Path (Get-Location) "target\debug\meshlet-tray-host.exe"
          Start-Process $trayHost `
            -ArgumentList "$(Resolve-Path tray-fixture\online)" `
            -RedirectStandardError "$PWD\tray-host.log" -RedirectStandardOutput "$PWD\tray-host.out"

      - name: Capture desktop screenshot
        run: |
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.X, $screen.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("$PWD\tray-windows.png")

      # 先停进程再验门禁：重定向日志在进程持有期间被锁，读不到内容（上轮踩坑）。
      - name: Stop stub and tray host
        if: always()
        run: |
          Get-Process meshlet-tray-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

      # 门禁：托盘图标注册成功（NIM_ADD = true）且 tooltip 随状态 JSON 更新。
      - name: Gate on tray registration evidence
        run: |
          Get-Content tray-host.log | Write-Output
          $log = Get-Content tray-host.log -Raw
          if ($log -notmatch 'NIM_ADD = (true|1)') { Write-Error 'tray icon was not registered (NIM_ADD)'; exit 1 }
          if ($log -notmatch 'tooltip=') { Write-Error 'tooltip was not applied from status.json'; exit 1 }

      - name: Upload tray evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tray-windows-evidence
          path: |
            tray-windows.png
            tray-host.log
            tray-fixture/**/status.json
            tray-fixture/**/*.png
          if-no-files-found: warn

  installer-windows:
    name: installer / windows-latest
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Build installer payload
        timeout-minutes: 20
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin meshlet-agent --bin meshlet-cli --bin meshlet-tray-host

      - name: Package staged archive
        shell: pwsh
        run: |
          scripts/package-windows-zip.ps1 -Target x86_64-pc-windows-msvc
          $hash = (Get-FileHash dist\meshlet-nightly-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *meshlet-nightly-windows-x86_64.zip" | Set-Content dist\SHA256SUMS -Encoding ascii

      - name: Run staged installer
        shell: pwsh
        run: |
          $env:MESHLET_INSTALL_ARCHIVE = "$PWD\dist\meshlet-nightly-windows-x86_64.zip"
          $env:MESHLET_INSTALL_SHA256SUMS = "$PWD\dist\SHA256SUMS"
          scripts\install.ps1 `
            -ServerUrl 'http://127.0.0.1:9' `
            -HubEndpoint '127.0.0.1:9' `
            -BootstrapToken 'ci-bootstrap-token' `
            -DeviceName 'ci-windows-installer'

      - name: Verify tray installation
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'meshlet'
          $stateDir = Join-Path $installDir 'state'
          foreach ($name in 'meshlet-agent.exe', 'meshlet-tray-host.exe') {
            $path = Join-Path $installDir $name
            if (-not (Test-Path $path)) { throw "installer did not copy $name" }
          }
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $expectedTray = '"{0}" "{1}"' -f (Join-Path $installDir 'meshlet-tray-host.exe'), $stateDir
          $trayRun = Get-ItemPropertyValue -Path $runKey -Name 'meshlet-tray-host'
          if ($trayRun -ne $expectedTray) { throw "unexpected tray Run value: $trayRun" }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $tray = Get-Process -Name 'meshlet-tray-host' -ErrorAction SilentlyContinue
            if ($tray) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $tray) { throw 'meshlet-tray-host process was not started' }
          Write-Output "meshlet-tray-host is running (PID $($tray[0].Id))"

      - name: Cleanup installed processes
        if: always()
        shell: pwsh
        run: |
          Get-Process meshlet-tray-host -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process meshlet-agent -ErrorAction SilentlyContinue | Stop-Process -Force

  console:
    name: console build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: Type check and build
        working-directory: console
        run: pnpm run build

  walkthrough:
    name: walkthrough / ubuntu-latest
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build release package
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir console build
          cargo build --locked --release --target x86_64-unknown-linux-gnu --bin meshlet-server --bin meshlet-agent --bin meshlet-cli
          scripts/package-release.sh x86_64-unknown-linux-gnu x86_64
          (cd dist && sha256sum meshlet-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Install from staged release archive
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d)
          tar -xzf dist/meshlet-linux-x86_64.tar.gz -C "$install_dir"
          sudo env \
            MESHLET_INSTALL_ARCHIVE="$PWD/dist/meshlet-linux-x86_64.tar.gz" \
            MESHLET_INSTALL_SHA256SUMS="$PWD/dist/SHA256SUMS" \
            bash "$install_dir/install.sh" server --bind 127.0.0.1:8080
      - name: Verify clean-host walkthrough gates
        run: |
          set -euo pipefail
          sudo systemctl cat meshlet-server | tee /tmp/meshlet-unit.txt
          sudo systemctl is-active --quiet meshlet-server
          id meshlet | tee /tmp/meshlet-account.txt
          test "$(stat -c '%U:%G %a' /etc/meshlet/hub.key)" = 'meshlet:meshlet 600'
          test "$(stat -c '%U:%G %a' /etc/meshlet/meshlet.toml)" = 'meshlet:meshlet 600'
          test "$(stat -c '%a' /var/lib/meshlet)" = 700
          sudo grep -Fx 'bind = "127.0.0.1:8080"' /etc/meshlet/meshlet.toml | tee /tmp/meshlet-bind.txt
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/api/v1/system/status; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/system/status >/dev/null
          sudo ss -ltnp | grep -F '127.0.0.1:8080' | grep -F 'users:(("meshlet-server"' | tee /tmp/meshlet-listener.txt
          test ! -r /etc/meshlet/hub.key
          first=/tmp/meshlet-first-bootstrap.json
          second=/tmp/meshlet-second-bootstrap.json
          first_status=$(curl --silent --show-error --output "$first" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"admin@test.local","password":"walkthrough-password-123"}' \
            http://127.0.0.1:8080/api/v1/auth/bootstrap)
          test "$first_status" = 201
          second_status=$(curl --silent --show-error --output "$second" --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"email":"second@test.local","password":"walkthrough-password-123"}' \
            http://127.0.0.1:8080/api/v1/auth/bootstrap)
          test "$second_status" = 409
          sudo systemctl show meshlet-server \
            -p User -p Group -p NoNewPrivileges -p CapabilityBoundingSet \
            -p ProtectSystem -p PrivateDevices -p RestrictAddressFamilies \
            | tee /tmp/meshlet-security.txt
      - name: Upload walkthrough evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: walkthrough-evidence
          path: |
            /tmp/meshlet-account.txt
            /tmp/meshlet-bind.txt
            /tmp/meshlet-first-bootstrap.json
            /tmp/meshlet-listener.txt
            /tmp/meshlet-second-bootstrap.json
            /tmp/meshlet-security.txt
            /tmp/meshlet-unit.txt
          if-no-files-found: ignore
