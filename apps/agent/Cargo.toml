[package]
name = "meshlet-agent"
description = "Meshlet device agent (fetches its plan, reconciles, applies the local data plane)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
meshlet-config = { workspace = true }
meshlet-network = { workspace = true }
meshlet-domain = { workspace = true }
ureq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
