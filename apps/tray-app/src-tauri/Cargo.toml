[package]
name = "meshlet-tray"
description = "meshlet Windows tray host with settings UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
meshlet-commands = { workspace = true }
meshlet-network = { workspace = true }

[dev-dependencies]
# 契约测试用 mock runtime（MockRuntime 平台无关，宿主/交叉 check 两腿都可编译）。
tauri = { version = "2", features = ["test"] }
