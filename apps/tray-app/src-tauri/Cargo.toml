[package]
name = "meshlet-tray"
description = "meshlet Windows tray host with settings UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
meshlet-commands = { workspace = true }
meshlet-network = { workspace = true }

[dev-dependencies]
# Mock runtime for the contract tests (MockRuntime is platform-independent, so both the host and cross-check legs compile).
tauri = { version = "2", features = ["test"] }
