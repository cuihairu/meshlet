<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meshlet 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px;
    }
    h1 { font-size: 18px; margin-bottom: 20px; color: #4e8fa6; }
    .status-bar {
      background: #16213e;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #80868c;
    }
    .status-dot.online { background: #22c55e; }
    .status-dot.error { background: #ef4444; }
    .status-text { font-size: 14px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      color: #80868c;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
    }
    .field input:focus { outline: none; border-color: #4e8fa6; }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary { background: #4e8fa6; color: #fff; }
    .btn-primary:hover { background: #5a9fb8; }
    .btn-secondary { background: #2a2a4a; color: #e0e0e0; }
    .btn-secondary:hover { background: #3a3a5a; }
    .msg { font-size: 13px; margin-top: 12px; color: #22c55e; display: none; }
  </style>
</head>
<body>
  <h1>Meshlet 设置</h1>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">加载中...</span>
  </div>

  <div class="field">
    <label for="serverUrl">服务器地址</label>
    <input id="serverUrl" type="text" placeholder="https://meshlet.example.com" />
  </div>

  <div class="field">
    <label for="deviceName">设备名称</label>
    <input id="deviceName" type="text" placeholder="my-device" />
  </div>

  <div class="field">
    <label for="hubEndpoint">Hub 端点</label>
    <input id="hubEndpoint" type="text" placeholder="1.2.3.4:51820" />
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="save()">保存</button>
    <button class="btn btn-secondary" onclick="window.close()">关闭</button>
  </div>

  <div class="msg" id="msg"></div>

  <script type="module">
    // Tauri v2 内置 IPC：直接用 window.__TAURI_INTERNALS__.invoke
    const invoke = window.__TAURI_INTERNALS__?.invoke;
    if (!invoke) {
      document.getElementById('statusText').textContent = 'Tauri IPC 不可用';
    }

    async function load() {
      if (!invoke) return; // IPC 不可用：保留「Tauri IPC 不可用」提示，不覆盖。
      try {
        const status = await invoke('get_status');
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        text.textContent = status.tooltip || status.state || '未知';
        const s = (status.state || '').toLowerCase();
        if (['online','connected','ready','up','ok'].includes(s)) {
          dot.className = 'status-dot online';
        } else if (['error','failed','disconnected','down'].includes(s)) {
          dot.className = 'status-dot error';
        }
      } catch (e) {
        document.getElementById('statusText').textContent = '无法读取状态';
      }

      try {
        const cfg = await invoke('get_config');
        document.getElementById('serverUrl').value = cfg.server_url || '';
        document.getElementById('deviceName').value = cfg.device_name || '';
        document.getElementById('hubEndpoint').value = cfg.hub_endpoint || '';
      } catch (e) {
        // ignore
      }
    }

    async function save() {
      if (!invoke) return; // IPC 不可用：不执行保存。
      try {
        await invoke('save_config', {
          serverUrl: document.getElementById('serverUrl').value,
          deviceName: document.getElementById('deviceName').value,
          hubEndpoint: document.getElementById('hubEndpoint').value,
        });
        const msg = document.getElementById('msg');
        msg.textContent = '已保存，重启 agent 后生效';
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      } catch (e) {
        const msg = document.getElementById('msg');
        msg.textContent = '保存失败: ' + e;
        msg.style.color = '#ef4444';
        msg.style.display = 'block';
      }
    }

    load();
  </script>
</body>
</html>
