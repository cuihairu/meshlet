[package]
name = "meshlet-network"
description = "Meshlet unified NetworkBackend abstraction"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
meshlet-domain = { workspace = true }
meshlet-publish = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rand_core = { workspace = true }
x25519-dalek = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wireguard-nt = "0.5.0"
# wireguard-nt 的 SetInterface.allowed_ips/地址装配用 ipnet 类型；与
# wireguard-nt 0.5.0 锁定的同一 2.12 线，不引入第二版本。
ipnet = "2.12"
