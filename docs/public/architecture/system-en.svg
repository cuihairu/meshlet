<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Meshlet processes and data flow</title><desc id="desc">Solid lines carry business data: console traffic, desired plans and receipts, hub tunnel plans, kernel changes. Dashed lines carry registration and recovery: bootstrap-token enrollment and hub recovery on boot. The server owns the hub tunnel, every device runs the agent, and the kernel forwards.</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="900" fill="#fff"/>
<text x="28" y="42" font-size="27" font-weight="600" text-anchor="start">Processes and data flow</text>
<text x="28" y="74" font-size="17" font-weight="400" text-anchor="start" class="sub">The server owns the hub tunnel; every device runs the agent; the kernel does the forwarding.</text>
<rect x="28" y="102" width="1224" height="266" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="130" font-size="17" font-weight="600" text-anchor="start" class="teal">Control plane · hub host</text>
<g data-node="browser console">
<rect x="60" y="150" width="250" height="92" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="78" y="180" font-size="23" font-weight="600" text-anchor="start">Browser console</text>
<text x="78" y="208" font-size="17" font-weight="400" text-anchor="start" class="sub">React SPA · served by the server</text>
<text x="78" y="230" font-size="17" font-weight="400" text-anchor="start" class="sub">session cookie · API token</text>
</g>
<g data-node="meshlet-server">
<rect x="400" y="150" width="430" height="190" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="418" y="182" font-size="23" font-weight="600" text-anchor="start">meshlet-server</text>
<text x="418" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">Console + agent HTTP/TLS · axum</text>
<text x="418" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">Auth · bootstrap tokens · approval</text>
<text x="418" y="266" font-size="17" font-weight="400" text-anchor="start" class="sub">Planner · revisions · audit</text>
<text x="418" y="292" font-size="17" font-weight="400" text-anchor="start" class="sub">Publish plan · diagnostics</text>
<text x="418" y="318" font-size="14" font-weight="500" text-anchor="start" class="sub">hub tunnel rebuilt from the database on boot</text>
</g>
<g data-node="meshlet.db">
<rect x="920" y="150" width="300" height="190" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="938" y="182" font-size="23" font-weight="600" text-anchor="start">meshlet.db</text>
<text x="938" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">SQLite · single file · 0600</text>
<text x="938" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">state · revisions · audit</text>
<text x="938" y="266" font-size="17" font-weight="400" text-anchor="start" class="sub">hub_deployments journal</text>
<text x="938" y="292" font-size="14" font-weight="500" text-anchor="start" class="sub">backup is a plaintext copy of the file</text>
</g>
<path d="M310 198 L400 198" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="307" y="172" width="96" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="355" y="188" font-size="14" font-weight="500" text-anchor="middle" class="blue">HTTPS · session</text>
<path d="M830 198 L920 198" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="825" y="172" width="100" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="875" y="188" font-size="14" font-weight="500" text-anchor="middle" class="blue">state · revisions</text>
<rect x="28" y="392" width="1224" height="140" rx="10" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="420" font-size="17" font-weight="600" text-anchor="start" class="teal">Kernel dataplane · hub relays</text>
<g data-node="hub tunnel">
<rect x="200" y="436" width="600" height="72" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="500" y="468" font-size="21" font-weight="600" text-anchor="middle">WireGuard hub tunnel</text>
<text x="500" y="494" font-size="16" font-weight="400" text-anchor="middle" class="sub">wg0 10.240.0.0/16 · UDP 51820 · MTU 1420</text>
</g>
<text x="824" y="470" font-size="15" font-weight="400" text-anchor="start" class="sub">No direct device-to-device P2P today:</text>
<text x="824" y="492" font-size="15" font-weight="400" text-anchor="start" class="sub">all device pairs relay through the hub.</text>
<path d="M560 340 L560 436" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="440" y="378" width="100" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="490" y="394" font-size="14" font-weight="500" text-anchor="middle" class="blue">hub tunnel plan</text>
<path d="M700 340 L700 436" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="712" y="378" width="124" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="774" y="394" font-size="14" font-weight="500" text-anchor="middle" class="teal">recover on boot</text>
<rect x="28" y="556" width="1224" height="224" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="584" font-size="17" font-weight="600" text-anchor="start" class="teal">Devices · one agent binary per host</text>
<g data-node="meshlet-agent device">
<rect x="60" y="608" width="420" height="152" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="78" y="640" font-size="23" font-weight="600" text-anchor="start">meshlet-agent</text>
<text x="78" y="668" font-size="17" font-weight="400" text-anchor="start" class="sub">desired → apply → receipt → heartbeat</text>
<text x="78" y="694" font-size="17" font-weight="400" text-anchor="start" class="sub">ip · wg · iptables / nftables</text>
<text x="78" y="720" font-size="17" font-weight="400" text-anchor="start" class="sub">ledger applied.json · drift read-back</text>
<text x="78" y="742" font-size="14" font-weight="500" text-anchor="start" class="sub">dataplane disabled → kernel untouched</text>
</g>
<g data-node="meshlet-agent gateway">
<rect x="540" y="608" width="390" height="152" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="558" y="640" font-size="23" font-weight="600" text-anchor="start">meshlet-agent (gateway)</text>
<text x="558" y="668" font-size="17" font-weight="400" text-anchor="start" class="sub">LAN route publish · owner · metric</text>
<text x="558" y="694" font-size="17" font-weight="400" text-anchor="start" class="sub">SNAT / DNAT on the device</text>
<text x="558" y="720" font-size="17" font-weight="400" text-anchor="start" class="sub">publishing: forwarding · HTTP · DNS</text>
<text x="558" y="742" font-size="14" font-weight="500" text-anchor="start" class="sub">health probes reported upstream</text>
</g>
<g data-node="LAN">
<rect x="1020" y="608" width="200" height="152" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="1120" y="660" font-size="21" font-weight="600" text-anchor="middle">LAN</text>
<text x="1120" y="690" font-size="16" font-weight="400" text-anchor="middle" class="sub">real hosts</text>
<text x="1120" y="712" font-size="16" font-weight="400" text-anchor="middle" class="sub">behind the device</text>
</g>
<path d="M300 508 L300 608" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="312" y="546" width="118" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="371" y="562" font-size="14" font-weight="500" text-anchor="middle" class="blue">peers · MTU</text>
<path d="M700 508 L700 558 L790 558 L790 608" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="652" y="535" width="132" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="718" y="551" font-size="14" font-weight="500" text-anchor="middle" class="blue">peers · route · NAT</text>
<path d="M930 700 L1020 700" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="939" y="674" width="72" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="975" y="690" font-size="13" font-weight="500" text-anchor="middle" class="blue">route · NAT</text>
<path d="M60 660 L40 660 L40 316 L400 316" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="56" y="293" width="176" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="144" y="309" font-size="14" font-weight="500" text-anchor="middle" class="blue">desired · receipt · heartbeat</text>
<path d="M60 700 L20 700 L20 270 L400 270" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<rect x="56" y="247" width="128" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="120" y="263" font-size="14" font-weight="500" text-anchor="middle" class="teal">bootstrap · approval</text>
<rect x="28" y="804" width="560" height="64" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="46" y="834" font-size="21" font-weight="600" text-anchor="start">meshlet-cli</text>
<text x="46" y="858" font-size="15" font-weight="400" text-anchor="start" class="sub">CLI skeleton — no commands yet (source of truth is the code)</text>
<path d="M900 826 L946 826" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="958" y="832" font-size="16" font-weight="400" text-anchor="start" class="sub">Business / data</text>
<path d="M900 856 L946 856" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<text x="958" y="862" font-size="16" font-weight="400" text-anchor="start" class="sub">Registration / control</text>
</svg>
