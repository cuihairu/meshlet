<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1480" viewBox="0 0 480 1480" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Meshlet process topology</title><desc id="desc">Solid lines carry business data: console traffic, desired plans and receipts, hub tunnel plans, kernel changes. Dashed lines carry registration and recovery. The server owns the hub tunnel, every device runs the agent, and the kernel forwards.</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="480" height="1480" fill="#fff"/>
<text x="24" y="37" font-size="24" font-weight="600" text-anchor="start">Process topology</text>
<text x="24" y="67" font-size="18" font-weight="400" text-anchor="start" class="sub">Server owns the hub tunnel</text>
<text x="24" y="92" font-size="18" font-weight="400" text-anchor="start" class="sub">Devices run the agent; the kernel forwards</text>
<text x="30" y="140" font-size="18" font-weight="600" text-anchor="start" class="teal">Control plane · hub host</text>
<g data-node="browser console">
<rect x="30" y="158" width="420" height="86" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="190" font-size="23" font-weight="600" text-anchor="start">Browser console</text>
<text x="48" y="217" font-size="18" font-weight="400" text-anchor="start" class="sub">React SPA · served by the server</text>
</g>
<path d="M240 244 L240 288" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="140" y="254" width="200" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="240" y="270" font-size="18" font-weight="500" text-anchor="middle" class="blue">HTTPS · session</text>
<g data-node="meshlet-server">
<rect x="30" y="288" width="420" height="132" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="320" font-size="23" font-weight="600" text-anchor="start">meshlet-server</text>
<text x="48" y="347" font-size="18" font-weight="400" text-anchor="start" class="sub">Console + agent HTTP/TLS · axum</text>
<text x="48" y="373" font-size="18" font-weight="400" text-anchor="start" class="sub">Auth · bootstrap tokens · approval</text>
<text x="48" y="399" font-size="18" font-weight="400" text-anchor="start" class="sub">Planner · revisions · audit</text>
</g>
<path d="M240 420 L240 464" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="130" y="430" width="220" height="24" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="240" y="446" font-size="18" font-weight="500" text-anchor="middle" class="blue">state · revisions</text>
<g data-node="meshlet.db">
<rect x="30" y="464" width="420" height="112" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="496" font-size="23" font-weight="600" text-anchor="start">meshlet.db</text>
<text x="48" y="523" font-size="18" font-weight="400" text-anchor="start" class="sub">SQLite · single file · 0600</text>
<text x="48" y="549" font-size="18" font-weight="400" text-anchor="start" class="sub">state · revisions · audit</text>
</g>
<text x="30" y="600" font-size="17" font-weight="400" text-anchor="start" class="sub">Agent polls the desired plan, posts the</text>
<text x="30" y="624" font-size="17" font-weight="400" text-anchor="start" class="sub">receipt and the heartbeat.</text>
<text x="30" y="648" font-size="17" font-weight="400" text-anchor="start" class="sub">Devices self-register with a bootstrap token</text>
<text x="30" y="672" font-size="17" font-weight="400" text-anchor="start" class="sub">and wait for approval in the console.</text>
<path d="M450 354 L460 354 L460 768 L410 768" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M30 976 L16 976 L16 354 L30 354" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<text x="30" y="712" font-size="18" font-weight="600" text-anchor="start" class="teal">Kernel dataplane · hub relays</text>
<g data-node="hub tunnel">
<rect x="30" y="728" width="380" height="80" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="220" y="752" font-size="21" font-weight="600" text-anchor="middle">WireGuard hub tunnel</text>
<text x="220" y="780" font-size="16" font-weight="400" text-anchor="middle" class="sub">wg0 10.240.0.0/16 · UDP 51820 · MTU 1420</text>
</g>
<text x="30" y="836" font-size="17" font-weight="400" text-anchor="start" class="sub">No direct P2P today: every device pair</text>
<text x="30" y="860" font-size="17" font-weight="400" text-anchor="start" class="sub">relays through the hub.</text>
<text x="30" y="900" font-size="18" font-weight="600" text-anchor="start" class="teal">Devices · one agent binary per host</text>
<g data-node="meshlet-agent device">
<rect x="30" y="916" width="420" height="120" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="948" font-size="23" font-weight="600" text-anchor="start">meshlet-agent</text>
<text x="48" y="975" font-size="17" font-weight="400" text-anchor="start" class="sub">desired → apply → receipt → heartbeat</text>
<text x="48" y="999" font-size="17" font-weight="400" text-anchor="start" class="sub">ip · wg · iptables / nftables</text>
<text x="48" y="1023" font-size="17" font-weight="400" text-anchor="start" class="sub">ledger applied.json · drift read-back</text>
</g>
<g data-node="meshlet-agent gateway">
<rect x="30" y="1064" width="420" height="120" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="1096" font-size="23" font-weight="600" text-anchor="start">meshlet-agent (gateway)</text>
<text x="48" y="1123" font-size="17" font-weight="400" text-anchor="start" class="sub">LAN route publish · owner · metric</text>
<text x="48" y="1147" font-size="17" font-weight="400" text-anchor="start" class="sub">SNAT / DNAT on the device</text>
<text x="48" y="1171" font-size="17" font-weight="400" text-anchor="start" class="sub">publishing: forwarding · HTTP · DNS</text>
</g>
<g data-node="LAN">
<rect x="30" y="1212" width="420" height="64" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="240" y="1238" font-size="21" font-weight="600" text-anchor="middle">LAN</text>
<text x="240" y="1262" font-size="16" font-weight="400" text-anchor="middle" class="sub">real hosts behind the device</text>
</g>
<g data-node="meshlet-cli">
<rect x="30" y="1304" width="420" height="88" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="1336" font-size="23" font-weight="600" text-anchor="start">meshlet-cli</text>
<text x="48" y="1363" font-size="18" font-weight="400" text-anchor="start" class="sub">CLI skeleton — no commands yet</text>
</g>
<path d="M170 1424 L216 1424" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="228" y="1430" font-size="17" font-weight="400" text-anchor="start" class="sub">Business / data</text>
<path d="M170 1452 L216 1452" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<text x="228" y="1458" font-size="17" font-weight="400" text-anchor="start" class="sub">Registration / control</text>
</svg>
