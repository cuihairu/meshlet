<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Meshlet 进程与数据流</title><desc id="desc">实线表示业务数据：控制台流量、期望计划与回执、hub 隧道计划、内核变更。虚线表示注册与恢复：自举 Token 注册与启动时的 hub 恢复。server 拥有 hub 隧道，每台设备上跑 agent，内核负责转发。</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#245bb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#147565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b45}.sub{fill:#4c5d73}.blue{fill:#245bb2}.teal{fill:#147565}</style>
</defs><rect width="1280" height="900" fill="#fff"/>
<text x="28" y="42" font-size="27" font-weight="600" text-anchor="start">进程与数据流</text>
<text x="28" y="74" font-size="17" font-weight="400" text-anchor="start" class="sub">server 拥有 hub 隧道，每台设备上跑 agent，内核负责转发。</text>
<rect x="28" y="102" width="1224" height="266" rx="10" fill="#f4f9f8" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="130" font-size="17" font-weight="600" text-anchor="start" class="teal">控制平面 · hub 主机</text>
<g data-node="浏览器控制台">
<rect x="60" y="150" width="250" height="92" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="78" y="180" font-size="23" font-weight="600" text-anchor="start">浏览器控制台</text>
<text x="78" y="208" font-size="17" font-weight="400" text-anchor="start" class="sub">React SPA · 静态托管</text>
<text x="78" y="230" font-size="17" font-weight="400" text-anchor="start" class="sub">会话 cookie · API Token</text>
</g>
<g data-node="meshlet-server">
<rect x="400" y="150" width="430" height="190" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="418" y="182" font-size="23" font-weight="600" text-anchor="start">meshlet-server</text>
<text x="418" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">控制台 + agent HTTP/TLS · axum</text>
<text x="418" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">认证 · 自举 Token · 审批</text>
<text x="418" y="266" font-size="17" font-weight="400" text-anchor="start" class="sub">规划器 · 版本 · 审计</text>
<text x="418" y="292" font-size="17" font-weight="400" text-anchor="start" class="sub">发布计划 · 诊断</text>
<text x="418" y="318" font-size="14" font-weight="500" text-anchor="start" class="sub">启动时从数据库重建 hub 隧道</text>
</g>
<g data-node="meshlet.db">
<rect x="920" y="150" width="300" height="190" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="938" y="182" font-size="23" font-weight="600" text-anchor="start">meshlet.db</text>
<text x="938" y="214" font-size="17" font-weight="400" text-anchor="start" class="sub">SQLite · 单文件 · 0600</text>
<text x="938" y="240" font-size="17" font-weight="400" text-anchor="start" class="sub">状态 · 版本 · 审计</text>
<text x="938" y="266" font-size="17" font-weight="400" text-anchor="start" class="sub">hub_deployments 日志</text>
<text x="938" y="292" font-size="14" font-weight="500" text-anchor="start" class="sub">备份是该文件的明文副本</text>
</g>
<path d="M310 198 L400 198" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="295" y="172" width="120" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="355" y="188" font-size="14" font-weight="500" text-anchor="middle" class="blue">HTTPS / 会话</text>
<path d="M830 198 L920 198" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="833" y="172" width="84" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="875" y="188" font-size="14" font-weight="500" text-anchor="middle" class="blue">状态 · 版本</text>
<rect x="28" y="392" width="1224" height="140" rx="10" fill="#f5f7fa" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="420" font-size="17" font-weight="600" text-anchor="start" class="teal">内核数据面 · hub 中继</text>
<g data-node="hub 隧道">
<rect x="200" y="436" width="600" height="72" rx="10" fill="#f0f5fe" stroke="#9bb5dc" stroke-width="1.3"/>
<text x="500" y="468" font-size="21" font-weight="600" text-anchor="middle">WireGuard hub 隧道</text>
<text x="500" y="494" font-size="16" font-weight="400" text-anchor="middle" class="sub">wg0 10.240.0.0/16 · UDP 51820 · MTU 1420</text>
</g>
<text x="824" y="470" font-size="15" font-weight="400" text-anchor="start" class="sub">今天没有设备间直连 P2P：</text>
<text x="824" y="492" font-size="15" font-weight="400" text-anchor="start" class="sub">所有设备两两流量都经 hub 中转。</text>
<path d="M560 340 L560 436" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="438" y="378" width="104" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="490" y="394" font-size="14" font-weight="500" text-anchor="middle" class="blue">hub 隧道计划</text>
<path d="M700 340 L700 436" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<rect x="735" y="378" width="78" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="774" y="394" font-size="14" font-weight="500" text-anchor="middle" class="teal">启动时恢复</text>
<rect x="28" y="556" width="1224" height="224" rx="10" fill="#f8fafc" stroke="#ced8e5" stroke-width="1.3"/>
<text x="48" y="584" font-size="17" font-weight="600" text-anchor="start" class="teal">设备 · 每台一个 agent 二进制</text>
<g data-node="meshlet-agent 设备">
<rect x="60" y="608" width="420" height="152" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="78" y="640" font-size="23" font-weight="600" text-anchor="start">meshlet-agent</text>
<text x="78" y="668" font-size="17" font-weight="400" text-anchor="start" class="sub">拉期望 → 应用 → 回执 → 心跳</text>
<text x="78" y="694" font-size="17" font-weight="400" text-anchor="start" class="sub">ip · wg · iptables / nftables</text>
<text x="78" y="720" font-size="17" font-weight="400" text-anchor="start" class="sub">账本 applied.json · 读回校验</text>
<text x="78" y="742" font-size="14" font-weight="500" text-anchor="start" class="sub">数据面关闭时不碰内核</text>
</g>
<g data-node="meshlet-agent 网关">
<rect x="540" y="608" width="390" height="152" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="558" y="640" font-size="23" font-weight="600" text-anchor="start">meshlet-agent（网关）</text>
<text x="558" y="668" font-size="17" font-weight="400" text-anchor="start" class="sub">发布 LAN 路由 · owner · metric</text>
<text x="558" y="694" font-size="17" font-weight="400" text-anchor="start" class="sub">设备上做 SNAT / DNAT</text>
<text x="558" y="720" font-size="17" font-weight="400" text-anchor="start" class="sub">服务发布：转发 · HTTP · DNS</text>
<text x="558" y="742" font-size="14" font-weight="500" text-anchor="start" class="sub">健康探针上报</text>
</g>
<g data-node="局域网">
<rect x="1020" y="608" width="200" height="152" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="1120" y="660" font-size="21" font-weight="600" text-anchor="middle">局域网</text>
<text x="1120" y="690" font-size="16" font-weight="400" text-anchor="middle" class="sub">真实主机</text>
<text x="1120" y="712" font-size="16" font-weight="400" text-anchor="middle" class="sub">在设备后面</text>
</g>
<path d="M300 508 L300 608" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="328" y="546" width="86" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="371" y="562" font-size="14" font-weight="500" text-anchor="middle" class="blue">peer · MTU</text>
<path d="M700 508 L700 558 L790 558 L790 608" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="653" y="535" width="130" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="718" y="551" font-size="14" font-weight="500" text-anchor="middle" class="blue">peer · 路由 · NAT</text>
<path d="M930 700 L1020 700" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="936" y="674" width="78" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="975" y="690" font-size="13" font-weight="500" text-anchor="middle" class="blue">路由 · NAT</text>
<path d="M60 660 L40 660 L40 316 L400 316" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<rect x="74" y="293" width="140" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="144" y="309" font-size="14" font-weight="500" text-anchor="middle" class="blue">期望 · 回执 · 心跳</text>
<path d="M60 700 L20 700 L20 270 L400 270" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" marker-start="url(#teal)" stroke-dasharray="7 6"/>
<rect x="52" y="247" width="136" height="23" rx="3" fill="#fff" stroke="none" stroke-width="1.3"/>
<text x="120" y="263" font-size="14" font-weight="500" text-anchor="middle" class="teal">自举 Token · 审批</text>
<rect x="28" y="804" width="560" height="64" rx="10" fill="#fff" stroke="#ced8e5" stroke-width="1.3"/>
<text x="46" y="834" font-size="21" font-weight="600" text-anchor="start">meshlet-cli</text>
<text x="46" y="858" font-size="15" font-weight="400" text-anchor="start" class="sub">CLI 骨架 — 尚无子命令（以源码为准）</text>
<path d="M900 826 L946 826" fill="none" stroke="#245bb2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="958" y="832" font-size="16" font-weight="400" text-anchor="start" class="sub">业务 / 数据</text>
<path d="M900 856 L946 856" fill="none" stroke="#147565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)" stroke-dasharray="7 6"/>
<text x="958" y="862" font-size="16" font-weight="400" text-anchor="start" class="sub">注册 / 控制</text>
</svg>
