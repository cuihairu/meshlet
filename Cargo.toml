[workspace]
resolver = "2"
members = [
    "crates/meshlet-domain",
    "crates/meshlet-api-types",
    "crates/meshlet-config",
    "crates/meshlet-network",
    "crates/meshlet-planner",
    "crates/meshlet-store",
    "crates/meshlet-publish",
    "crates/meshlet-executor",
    "apps/server",
    "apps/agent",
    "apps/cli",
    "apps/tray-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
http-body-util = "0.1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"
rand = "0.9"
chrono = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
argon2 = "0.5"
ureq = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
windows-sys = "0.59"

meshlet-domain = { path = "crates/meshlet-domain" }
meshlet-api-types = { path = "crates/meshlet-api-types" }
meshlet-config = { path = "crates/meshlet-config" }
meshlet-network = { path = "crates/meshlet-network" }
meshlet-net-linux = { path = "crates/meshlet-net-linux" }
meshlet-planner = { path = "crates/meshlet-planner" }
meshlet-publish = { path = "crates/meshlet-publish" }
meshlet-agent = { path = "apps/agent" }

[profile.release]
lto = "thin"
